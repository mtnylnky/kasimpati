<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nazo'nun Kasımpatı Tarlası</title>
<style>
:root{--bg:#fdf6e9;--fg:#3b2a1a;--btn:#fff;--btnfg:#3b2a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110d;--fg:#f3e8d4;--btn:#2a231a;--btnfg:#f3e8d4}}
:root[data-theme="dark"]{--bg:#14110d;--fg:#f3e8d4;--btn:#2a231a;--btnfg:#f3e8d4}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ui{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;pointer-events:none}
.ui h1{margin:0;font-size:clamp(18px,3.2vw,28px);font-weight:normal;letter-spacing:.04em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
button{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--btn);color:var(--btnfg);border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:15px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui"><h1>Kasımpatı Tarlası</h1></div>
<button id="r">Yeniden başlat</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,plants=[],T0=performance.now(),horizon,unit;
const PAL=[{h:48,s:95,l:52},{h:0,s:0,l:90},{h:330,s:75,l:68},{h:278,s:60,l:56},{h:24,s:95,l:55},{h:352,s:80,l:48},{h:300,s:65,l:55},{h:12,s:85,l:62},{h:200,s:15,l:96}];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-t,3);
function build(){
  plants=[];
  const rows=9;
  for(let r=0;r<rows;r++){
    const f=r/(rows-1),s=.4+.6*f;
    const y=horizon+(H-horizon)*(.08+.88*f);
    const sp=58*unit*s*1.05;
    const n=Math.ceil(W/sp)+1;
    for(let i=0;i<n;i++){
      const col=PAL[Math.floor(Math.random()*PAL.length)];
      plants.push({x:(i+Math.random()*.6-.3)*sp,y:y+Math.random()*6*s,s,col,
        delay:Math.random()*4.5+f*.4,ph:Math.random()*6.28,
        h:(120+Math.random()*60)*unit*s,rot:Math.random()*6.28,lean:Math.random()*8-4});
    }
  }
  plants.sort((a,b)=>a.y-b.y);
}
function resize(){
  DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  horizon=H*.38;unit=Math.max(.6,Math.min(W/900,H/700));build();
}
addEventListener('resize',resize);
document.getElementById('r').onclick=()=>{T0=performance.now();build()};

function bg(){
  let g=ctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,'#7fb8e6');g.addColorStop(1,'#fbe7c4');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon+2);
  const sg=ctx.createRadialGradient(W*.8,horizon*.45,2,W*.8,horizon*.45,90*unit);
  sg.addColorStop(0,'rgba(255,248,200,1)');sg.addColorStop(.3,'rgba(255,240,170,.6)');sg.addColorStop(1,'rgba(255,240,170,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,horizon+2);
  g=ctx.createLinearGradient(0,horizon,0,H);
  g.addColorStop(0,'#6b8f3a');g.addColorStop(.25,'#4f7a2c');g.addColorStop(1,'#3b2a1a');
  ctx.fillStyle=g;ctx.fillRect(0,horizon,W,H-horizon);
}
function pt(p0,c,p2,u){const a=(1-u)*(1-u),b=2*(1-u)*u,d=u*u;return[a*p0[0]+b*c[0]+d*p2[0],a*p0[1]+b*c[1]+d*p2[1]]}

function flower(x,y,R,p,t,sw){
  const c=p.col,L=4;
  ctx.save();ctx.translate(x,y);ctx.scale(1,.86);ctx.rotate(p.rot+sw*.02);
  for(let i=0;i<L;i++){
    const n=12+i*3,len=R*(1-i*.19),wd=len*.27,off=i*.31+p.ph;
    ctx.fillStyle=`hsl(${c.h},${c.s}%,${clamp(c.l-8+i*7,0,98)}%)`;
    ctx.strokeStyle=`hsla(${c.h},${c.s}%,${clamp(c.l-26,0,90)}%,.55)`;
    ctx.lineWidth=.5;
    for(let k=0;k<n;k++){
      const a=off+k/n*6.2832;
      ctx.save();ctx.rotate(a);
      ctx.beginPath();ctx.ellipse(len*.55,0,len*.5,wd,0,0,6.2832);ctx.fill();ctx.stroke();
      ctx.restore();
    }
  }
  ctx.fillStyle=c.s<20?'#e8c33a':`hsl(${c.h},${c.s}%,${clamp(c.l+22,0,98)}%)`;
  ctx.beginPath();ctx.arc(0,0,R*.12,0,6.2832);ctx.fill();
  ctx.restore();
}

function draw(p,t){
  const gt=clamp((t-p.delay)/3.2,0,1);
  if(gt<=0){ctx.fillStyle='rgba(30,20,10,.45)';ctx.beginPath();ctx.ellipse(p.x,p.y,4*p.s*unit,1.6*p.s*unit,0,0,6.2832);ctx.fill();return}
  const g=ease(gt),b=ease(clamp((t-p.delay-3.2)/3.5,0,1));
  const sw=Math.sin(t*1.3+p.ph+p.x*.01)*5*p.s*unit*g+p.lean*p.s*unit*g;
  const H1=p.h*g;
  const p0=[p.x,p.y],p2=[p.x+sw,p.y-H1],c=[p.x+sw*.3-p.lean*.5,p.y-H1*.55];
  ctx.strokeStyle='#2f6a22';ctx.lineWidth=Math.max(1.4,2.8*p.s*unit);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(...p0);ctx.quadraticCurveTo(c[0],c[1],p2[0],p2[1]);ctx.stroke();
  const fr=[.2,.34,.48,.62,.76];
  ctx.fillStyle='#3f8a2c';
  fr.forEach((f,i)=>{
    const q=clamp((g-f*.8)*4,0,1);if(q<=0)return;
    const [lx,ly]=pt(p0,c,p2,f);
    const side=i%2?1:-1,len=26*unit*p.s*(1-f*.35)*q;
    ctx.save();ctx.translate(lx,ly);
    ctx.rotate(side>0?-.6+Math.sin(t*1.3+i)*.05:-Math.PI+.6-Math.sin(t*1.3+i)*.05);
    ctx.beginPath();ctx.ellipse(len/2,0,len/2,len*.22,0,0,6.2832);ctx.fill();ctx.restore();
  });
  if(b<=0){
    ctx.fillStyle='#4a9a30';ctx.beginPath();ctx.arc(p2[0],p2[1],3.2*p.s*unit*g,0,6.2832);ctx.fill();return;
  }
  const R=27*unit*p.s*b;
  ctx.fillStyle='#3f8a2c';ctx.beginPath();ctx.arc(p2[0],p2[1]+R*.1,R*.35,0,6.2832);ctx.fill();
  flower(p2[0],p2[1],R,p,t,sw);
}
function loop(now){
  const t=(now-T0)/1000;
  bg();
  for(const p of plants)draw(p,t);
  requestAnimationFrame(loop);
}
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
